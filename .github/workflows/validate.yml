name: Marketplace and Home Assistant validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Offline unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        run: python -m pytest -q
      - name: Validate repository structure
        run: python scripts/validate_repository.py --release
      - name: Compile source
        run: python -m compileall -q custom_components/recall_watch

  marketplace:
    name: Marketplace repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install structural validator
        run: python -m pip install "PyYAML>=6.0,<7"
      - name: Verify Marketplace package contract
        run: python scripts/validate_marketplace.py

  hassfest:
    name: Home Assistant hassfest
    needs: [tests, live_sources, ha_runtime, marketplace]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enforce offline and Marketplace checks
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          MARKETPLACE_RESULT: ${{ needs.marketplace.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$MARKETPLACE_RESULT" = "success"
      - name: Enforce live and native Home Assistant PR checks
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          LIVE_RESULT: ${{ needs.live_sources.result }}
          HA_RESULT: ${{ needs.ha_runtime.result }}
        run: |
          test "$LIVE_RESULT" = "success"
          test "$HA_RESULT" = "success"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
  
  live_sources:
    name: Live publisher probes (release evidence, not automatic approval)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install probe dependencies
        run: python -m pip install "aiohttp>=3.14.5,<4" "defusedxml==0.7.1"
      - name: Probe live authority payloads
        run: python scripts/live_source_probe.py --output /tmp/recall-watch-live-results.json
      - name: Upload results for human review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recall-watch-live-probes
          path: /tmp/recall-watch-live-results.json
          if-no-files-found: warn

  ha_runtime:
    name: Home Assistant 2026.11 runtime tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant 2026.11 and official test harness
        run: |
          python -m pip install "homeassistant==2026.11.0" "pytest-homeassistant @ https://github.com/home-assistant/core/archive/refs/tags/2026.11.0.tar.gz#subdirectory=packages/pytest-homeassistant" "defusedxml==0.7.1"
          python -m pip check
      - name: Run integration tests against actual HA APIs
        run: python -m pytest tests/ha_runtime -q
