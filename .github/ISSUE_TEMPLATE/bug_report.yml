name: Bug report
description: Report a reproducible issue in Recall Watch
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Remove private data and credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Home Assistant and Recall Watch versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
